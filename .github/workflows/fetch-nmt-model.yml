# Fetches the Mozilla Firefox Translations zh→en model (MPL-2.0, ~38 MB gzipped)
# and opens a PR that adds it to vendor/nmt/.
# Source: Mozilla Remote Settings (the same place Firefox downloads its models
# from). The Git LFS objects in mozilla/firefox-translations-models are gone
# from GitHub (410), the build sandbox cannot reach Mozilla at all, and the
# CDN is unreliable from China — so the model is committed to the repo and
# served like the OCR bundle.
# Run it from the phone: Actions → "Fetch zh→en translation model" → Run workflow.
name: Fetch zh→en translation model
on:
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the zh→en model from Mozilla Remote Settings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, gzip, os, sys, urllib.request
          RS = "https://firefox.settings.services.mozilla.com/v1"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "zeichentrainer-model-fetch"})
              with urllib.request.urlopen(req, timeout=120) as r: return r.read()
          base = json.loads(get(RS + "/"))["capabilities"]["attachments"]["base_url"]
          recs = json.loads(get(RS + "/buckets/main/collections/translations-models/records?fromLang=zh&toLang=en"))["data"]
          print(f"{len(recs)} zh→en records; attachment base {base}")
          for r in recs:
              a = r.get("attachment", {})
              print(f"  {r.get('fileType'):9} v{r.get('version')} {r.get('architecture','')} {a.get('size')} {r.get('name')} {a.get('filename')}")
          if not recs: sys.exit("no zh→en records in Remote Settings")
          def vkey(v): return tuple(int(x) if x.isdigit() else 0 for x in str(v).replace("a","").replace("b","").split("."))
          # newest version; if several architectures share it, prefer the smallest model (base-memory)
          top = max(vkey(r["version"]) for r in recs)
          recs = [r for r in recs if vkey(r["version"]) == top]
          models = sorted([r for r in recs if r["fileType"] == "model"], key=lambda r: r["attachment"]["size"])
          if not models: sys.exit("no model record")
          model = models[0]; arch = model.get("architecture")
          same = [r for r in recs if r.get("architecture") == arch] if arch else recs
          picked = {}
          for ft in ("model", "lex", "vocab", "srcvocab", "trgvocab"):
              c = [r for r in same if r["fileType"] == ft]
              if c: picked[ft] = sorted(c, key=lambda r: r["attachment"]["size"])[0]
          if "vocab" not in picked and not ("srcvocab" in picked and "trgvocab" in picked): sys.exit("no vocab record")
          if "lex" not in picked: sys.exit("no lex (shortlist) record")
          os.makedirs("vendor/nmt", exist_ok=True)
          files, sizes, sha = {}, {}, {}
          for ft, r in picked.items():
              a = r["attachment"]; url = base + a["location"]
              print("downloading", ft, url)
              data = get(url)
              h = hashlib.sha256(data).hexdigest()
              if h != a["hash"]: sys.exit(f"hash mismatch for {ft}: {h} != {a['hash']}")
              if data[:2] != b"\x1f\x8b": data = gzip.compress(data, 9)  # store gzipped, the app decompresses
              name = r["name"]; name = name if name.endswith(".gz") else name + ".gz"
              open(os.path.join("vendor/nmt", name), "wb").write(data)
              files[ft] = name; sizes[ft] = len(data); sha[ft] = hashlib.sha256(data).hexdigest()
          out = {"available": True, "name": f"Firefox Translations zh→en {arch or ''} v{model['version']}".strip(), "from": "zh", "to": "en",
                 "license": "MPL-2.0", "source": "Mozilla Remote Settings, collection translations-models (https://github.com/mozilla/firefox-translations-models)",
                 "version": model["version"], "architecture": arch, "files": files, "sizes": sizes, "sha256": sha, "downloadBytes": sum(sizes.values())}
          json.dump(out, open("nmt-model.json", "w"), indent=1, ensure_ascii=False)
          print(json.dumps(out, indent=1, ensure_ascii=False))
          # bump both version markers so installed apps refresh the shell (and this manifest)
          import re
          sw = open("sw.js").read(); n = int(re.search(r'zt-v(\d+)', sw).group(1)) + 1
          open("sw.js", "w").write(re.sub(r'zt-v\d+', f'zt-v{n}', sw, count=1))
          ix = open("index.html").read(); open("index.html", "w").write(re.sub(r'PWA v\d+', f'PWA v{n}', ix, count=1))
          print("bumped to v", n)
          PY
          for f in vendor/nmt/*.gz; do gzip -t "$f"; done
          du -sh vendor/nmt; ls -la vendor/nmt
      - name: Commit to branch nmt-model and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B nmt-model
          git add vendor/nmt nmt-model.json sw.js index.html
          git commit -m "Add Mozilla zh→en translation model (vendor/nmt)"
          git push -f origin nmt-model
          gh pr create --base main --head nmt-model \
            --title "Add zh→en offline translation model (vendor/nmt)" \
            --body "Fetched by the *Fetch zh→en translation model* workflow from Mozilla Remote Settings (Firefox Translations, MPL-2.0). Adds model + shortlist + vocab (gzipped), fills nmt-model.json and bumps the PWA version. The app offers the download under More → Translation." \
            || echo "Could not open the PR automatically — open it from branch nmt-model."
