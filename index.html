<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="识字">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>识字 Zeichentrainer</title>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand">
      <span class="logo">识字</span>
      <span class="ver">PWA v19</span>
      <nav>
        <button class="tab on" data-mode="study">Learn</button>
        <button class="tab" data-mode="add">Add</button>
        <button class="tab" data-mode="inbox">Camera</button>
      </nav>
    </div>
    <div class="stats">
      <span id="stat-open"><b>DUE</b> <span class="v">0</span></span>
      <span id="stat-done"><b>DONE</b> <span class="j">0</span></span>
      <span id="stat-deck"><b>DECK</b> <span class="v">0</span></span>
    </div>
  </header>
  <main id="main" class="center"></main>
  <footer id="ftr">
    <span class="badge">STORAGE · persistent (on this device)</span>
    <div class="actions">
      <button class="reset" id="export">EXPORT</button>
      <button class="reset" id="import">IMPORT</button>
      <button class="reset" id="reset">RESET</button>
    </div>
  </footer>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="imp" type="file" accept="application/json,text/plain,.json,.txt" hidden>
<script src="./app.js"></script>
</body>
</html>
