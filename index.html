<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="color-scheme" content="light dark">
<style>html,body{background:#F2F2F7}@media(prefers-color-scheme:dark){html,body{background:#000}}</style> <!-- the page colour before styles.css arrives: no flash at the top -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="识字">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>识字 Zeichentrainer</title>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand"><span class="logo">识字</span><span class="ver">PWA v160</span></div>
    <div class="stats">
      <span id="stat-open"><b>Due</b><span class="v">0</span></span>
      <span id="stat-done"><b>Done</b><span class="j">0</span></span>
      <span id="stat-deck" style="display:none"><b>Deck</b><span class="v">0</span></span>
    </div>
  </header>
  <main id="main" class="center"></main>
  <nav id="tabs" aria-label="Sections">
    <button class="tab on" data-mode="study"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9.5h8M8 14h5"/></svg>Learn</button>
    <button class="tab" data-mode="cards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7.5" height="7.5" rx="2"/><rect x="13" y="4" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>Cards</button>
    <button class="tab" data-mode="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3.2l1.8-2.5h6l1.8 2.5H20v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>Camera</button>
    <button class="tab" data-mode="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>More</button>
  </nav>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="album" type="file" accept="image/*" multiple hidden>
<input id="imp" type="file" accept="application/json,text/plain,.json,.txt" hidden>
<script src="./app.js"></script>
</body>
</html>
